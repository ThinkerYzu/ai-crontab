[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-crontab"
version = "0.1.0"
description = "Schedule AI agent tasks, with a pull-only notification inbox"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kui-Feng Lee", email = "thinker.li@gmail.com" }]
keywords = ["cron", "scheduler", "ai", "agent", "claude", "mcp", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "croniter>=2.0",
    "mcp>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1"]

[project.urls]
Homepage = "https://github.com/ThinkerYzu/ai-crontab"
Issues = "https://github.com/ThinkerYzu/ai-crontab/issues"

[project.scripts]
ai-crontab = "ai_crontab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_crontab = ["web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
